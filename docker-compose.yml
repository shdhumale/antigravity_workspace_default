version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: productmgmt-db
    environment:
      MYSQL_DATABASE: productmgmt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: productmgmt-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/productmgmt?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: productmgmt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
