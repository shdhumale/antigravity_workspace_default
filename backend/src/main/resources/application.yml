spring:
  application:
    name: product-management-system

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/productmgmt?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  cache:
    type: caffeine
    cache-names: categories
    caffeine:
      spec: expireAfterWrite=60m,maximumSize=100

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT configuration for AuthService
app:
  jwt:
    secret: ${JWT_SECRET:5367566B5970337336763979244226452948404D635166546A576E5A72347537} # Placeholder secret for dev
    access-token-expiration: 900000 # 15 minutes
    refresh-token-expiration: 604800000 # 7 days

logging:
  level:
    com.productmgmt: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
