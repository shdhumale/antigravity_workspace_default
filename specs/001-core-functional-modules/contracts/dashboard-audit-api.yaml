openapi: "3.1.0"
info:
  title: Dashboard & Audit API
  description: Real-time KPI dashboard aggregates, activity feed, notification management, and audit log
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: dashboard
    description: KPI summary and activity feed
  - name: notifications
    description: In-app notification management
  - name: audit
    description: Immutable audit log query and export

paths:
  # ─────────────────────── Dashboard ───────────────────────
  /dashboard/kpis:
    get:
      tags: [dashboard]
      summary: Get role-scoped KPI summary cards
      operationId: getDashboardKpis
      responses:
        "200":
          description: KPI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/activity:
    get:
      tags: [dashboard]
      summary: Get activity feed (last 50 events, real-time via WebSocket)
      description: |
        Returns the last 50 system events. For real-time updates subscribe to the
        STOMP topic: `/topic/dashboard/{userId}` (role-scoped) or `/topic/dashboard/global` (Admin).
      operationId: getActivityFeed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Activity feed events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  # ─────────────────────── Notifications ───────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: List current user's notifications (paginated)
      operationId: listNotifications
      parameters:
        - name: isRead
          in: query
          schema:
            type: boolean
          description: Filter by read/unread status
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"

  /notifications/{id}/read:
    patch:
      tags: [notifications]
      summary: Mark a notification as read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"

  /notifications/read-all:
    patch:
      tags: [notifications]
      summary: Mark all current user's notifications as read
      operationId: markAllNotificationsRead
      responses:
        "204":
          description: All notifications marked as read

  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: Get count of unread notifications for badge display
      operationId: getUnreadCount
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  # ─────────────────────── Audit Log ───────────────────────
  /audit:
    get:
      tags: [audit]
      summary: Query audit log (Admin only)
      operationId: queryAuditLog
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
            enum: [USER, PRODUCT, APPROVAL_REQUEST, NOTIFICATION]
        - name: entityId
          in: query
          schema:
            type: string
        - name: performedBy
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, STATUS_CHANGE]
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit log records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/export:
    get:
      tags: [audit]
      summary: Export audit log as CSV (Admin only)
      operationId: exportAuditLog
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    DashboardKpis:
      type: object
      description: KPI values are role-scoped (Admin = system-wide; Manager = own products; Viewer = read-only totals)
      properties:
        totalUsers:
          type: integer
          nullable: true
          description: Admin only
        activeUsers:
          type: integer
          nullable: true
        totalProducts:
          type: integer
        productsByStatus:
          type: object
          properties:
            draft:
              type: integer
            pending:
              type: integer
            active:
              type: integer
            rejected:
              type: integer
            archived:
              type: integer
        generatedAt:
          type: string
          format: date-time

    ActivityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          description: e.g., PRODUCT_APPROVED, USER_CREATED, PRODUCT_SUBMITTED
        description:
          type: string
          description: Human-readable summary e.g., "Product 'Widget A' approved by admin@example.com"
        actorName:
          type: string
        occurredAt:
          type: string
          format: date-time
        entityType:
          type: string
        entityId:
          type: string

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true

    NotificationPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        entityType:
          type: string
        entityId:
          type: string
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE, STATUS_CHANGE]
        performedBy:
          type: string
          format: uuid
        performedByName:
          type: string
        performedAt:
          type: string
          format: date-time
        oldValue:
          type: object
          additionalProperties: true
          nullable: true
        newValue:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    ApiError:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
