openapi: "3.1.0"
info:
  title: Search API
  description: Full-text and multi-criteria product search and filtering
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: search
    description: Product search and filtering

paths:
  /search/products:
    get:
      tags: [search]
      summary: Search and filter products
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search keyword (matched against name and description)
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [DRAFT, PENDING, ACTIVE, REJECTED, ARCHIVED]
          style: form
          explode: true
          description: Filter by one or more statuses. Defaults to [ACTIVE] for non-Admin roles.
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
        - name: createdBy
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by creator user ID (Admin only)
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
          description: Include ARCHIVED products in results (false by default)
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, name_asc, newest]
            default: relevance
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /search/categories:
    get:
      tags: [search]
      summary: List categories for filter panel
      operationId: listCategories
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
          description: Fetch children of a specific parent (omit for root categories)
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    SearchResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer
        query:
          type: string
          description: Echo of the search keyword applied
        appliedFilters:
          type: object
          additionalProperties: true
          description: Echo of all active filters for frontend state persistence

    ProductSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        categoryName:
          type: string
        price:
          type: number
        inventoryQty:
          type: integer
        status:
          type: string
          enum: [DRAFT, PENDING, ACTIVE, REJECTED, ARCHIVED]
        thumbnailUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        childCount:
          type: integer

    ApiError:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
